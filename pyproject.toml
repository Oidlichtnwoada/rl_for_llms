[project]
name = "rl_for_llms"
version = "1.0.0"
description = "rl_for_llms"
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
    "datasets==4.5.0",
    "peft==0.18.1",
    "pydantic==2.12.5",
    "torch==2.10.0",
    "transformers==5.2.0",
    "wandb==0.25.0",
    "math-verify==0.9.0",
    "trl==0.28.0",
    "scikit-learn==1.8.0",
    "pandas==3.0.1",
    "scipy==1.17.0",
    "matplotlib==3.10.8",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.15.2",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D104", "D203", "D213", "COM812", "RET504", "PLR0913", "E501", "TC001", "TC002", "TC003", "PLW0108"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude_gitignore = true
