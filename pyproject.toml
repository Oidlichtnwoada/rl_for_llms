[project]
name = "rl_for_llms"
version = "1.0.0"
description = "rl_for_llms"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "datasets==5.0.1",
    "peft==0.21.0",
    "pydantic==2.13.5",
    "torch==2.14.0",
    "transformers==5.17.0",
    "wandb==0.30.0",
    "math-verify==0.9.0",
    "trl==1.13.0",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.8",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["S106", "D100", "D104", "D203", "D213", "COM812", "CPY001", "RET504", "PLR0913", "PLR0917", "E501", "TC001", "TC002", "TC003", "PLW0108"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude_gitignore = true
