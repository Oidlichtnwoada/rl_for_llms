[project]
name = "rl_for_llms"
version = "1.0.0"
description = "rl_for_llms"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "datasets==4.8.5",
    "peft==0.19.1",
    "pydantic==2.13.4",
    "torch==2.10.0",
    "transformers==5.8.1",
    "wandb==0.27.0",
    "math-verify==0.9.0",
    "trl==1.4.0",
    "scikit-learn==1.8.0",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.13",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["S106", "D100", "D104", "D203", "D213", "COM812", "RET504", "PLR0913", "E501", "TC001", "TC002", "TC003", "PLW0108"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude_gitignore = true
