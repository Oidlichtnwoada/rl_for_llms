[project]
name = "rl_for_llms"
version = "1.0.0"
description = "rl_for_llms"
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "datasets==4.4.2",
    "peft==0.18.0",
    "pydantic==2.12.5",
    "torch==2.9.1",
    "transformers[hf-xet]==4.57.3",
    "wandb==0.23.1",
    "math-verify==0.8.0",
    "trl==0.26.2",
    "scikit-learn==1.8.0",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "matplotlib==3.10.8",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.14.10",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D104", "D203", "D213", "COM812", "RET504", "PLR0913", "E501", "TC001", "TC002", "TC003"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude_gitignore = true
