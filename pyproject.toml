[project]
name = "rl_for_llms"
version = "1.0.0"
description = "rl_for_llms"
readme = "README.md"
requires-python = "==3.13.9"
dependencies = [
    "accelerate==1.11.0",
    "datasets==4.4.1",
    "dill==0.4.0",
    "fastapi[standard]==0.121.2",
    "grpcio==1.76.0",
    "hf-transfer==0.1.9",
    "hydra-core==1.3.2",
    "mathruler==0.1.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "optree==0.18.0",
    "pandas==2.3.3",
    "peft==0.18.0",
    "pyarrow==22.0.0",
    "pydantic==2.12.4",
    "qwen-vl-utils==0.0.14",
    "ray[default]==2.51.1",
    "tensordict==0.10.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchdata==0.11.0",
    "torchvision==0.23.0",
    "transformers[hf-xet]==4.57.1",
    "vllm==0.10.2",
    "xgrammar==0.1.23",
    "wandb==0.23.0",
    "math-verify==0.8.0",
    "tensorboard==2.20.0",
    "trl",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "ruff==0.14.5",
    "pytest==9.0.1",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D104", "D203", "D213", "COM812", "RET504", "PLR0913", "E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude_gitignore = true

[tool.uv.sources]
trl = { git = "https://github.com/huggingface/trl.git", rev = "fda5a7fcde8431122a1d9fbc23b774ca89442063" }
